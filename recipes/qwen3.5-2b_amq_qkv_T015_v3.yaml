quant_stage:
  quant_modifiers:
    generalDay0Modifier:
      scheme: W8A8
      ignore:
        # ---- Standard ignores (must keep BF16, not quantizable) ----
        - "re:.*lm_head"
        - "re:.*embed_tokens"
        - "re:.*mlp\\.gate$"
        - "re:.*mlp\\.(gate_proj|up_proj)$"
        # 1D / 3D tensors
        - "re:.*norm\\.weight$"
        - "re:.*norm1\\.weight$"
        - "re:.*norm2\\.weight$"
        - "re:.*q_norm\\.weight$"
        - "re:.*k_norm\\.weight$"
        - "re:.*linear_attn\\.A_log$"
        - "re:.*linear_attn\\.dt_bias$"
        - "re:.*linear_attn\\.conv1d.*"
        # MTP / Vision
        - "re:.*mtp\\..*"
        - "re:.*visual\\..*"
        # ---- AMQ qkv decisions (T=0.015) ----
        - "re:.*layers\\.19\\.self_attn\\.(q_proj|k_proj|v_proj)$"
        - "re:.*layers\\.23\\.self_attn\\.(q_proj|k_proj|v_proj)$"
        # ---- v3: GDN recurrent 环路全部 BF16 ----
        # in_proj_qkv / in_proj_z 是用户提示的重算子
        - "re:.*linear_attn\\.in_proj_qkv$"
        - "re:.*linear_attn\\.in_proj_z$"
        # in_proj_a / in_proj_b 是 recurrent 状态投影 (N=16), out_proj 是环路输出投影
        # 激活量化误差会在此环路累积, 全部保持 BF16
        - "re:.*linear_attn\\.in_proj_a$"
        - "re:.*linear_attn\\.in_proj_b$"
        - "re:.*linear_attn\\.out_proj$"
