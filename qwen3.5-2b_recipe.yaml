quant_stage:
  quant_modifiers:
    generalDay0Modifier:
      ignore:
        # ---- Standard ignore (per qlean docs) ----
        - "re:.*lm_head"
        - "re:.*embed_tokens"
        - "re:.*mlp.gate$"
        - "re:.*mlp.gate_proj"

        # ---- 1D / 3D tensors that cannot be quantized ----
        - "re:.*norm.weight$"
        - "re:.*norm1.weight$"
        - "re:.*norm2.weight$"
        - "re:.*q_norm.weight$"
        - "re:.*k_norm.weight$"
        - "re:.*linear_attn\\.A_log$"
        - "re:.*linear_attn\\.dt_bias$"
        - "re:.*linear_attn\\.conv1d.*"   # 3D conv weights

        # ---- AMQ insight (paper §5.4 Fig 12, Table 5) ----
        # V (Value) layers in self-attention CONSISTENTLY retain the highest
        # bit-width across all Pareto-optimal configurations. They are the
        # most critical for preserving model quality — keep BF16.
        - "re:.*self_attn\\.v_proj$"

        # ---- Qwen3.5 delta-net heavy/sensitive ops ----
        # Per user hint: q_k + q_v (combined in linear_attn.in_proj_qkv) and
        # q_j (linear_attn.in_proj_z) are the heavy operators. Per AMQ, the V
        # component must stay high precision; qlean cannot split precision
        # within a single linear layer, so we keep the whole projection BF16
        # to honor both the user's hint and AMQ's sensitivity principle.
        - "re:.*linear_attn\\.in_proj_qkv$"
        - "re:.*linear_attn\\.in_proj_z$"

        # ---- Modules not needed for text inference ----
        - "re:.*mtp\\..*"
        - "re:.*visual\\..*"
      scheme: W8A8